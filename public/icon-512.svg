<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e17"/>
      <stop offset="100%" stop-color="#040508"/>
    </linearGradient>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Rounded App Squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <rect width="508" height="508" x="2" y="2" rx="113" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  
  <!-- Outer Quantum Orbit -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <circle r="42" fill="url(#primaryGlow)"/>
    <ellipse rx="150" ry="62" fill="none" stroke="url(#primaryGlow)" stroke-width="10" transform="rotate(30)"/>
    <ellipse rx="150" ry="62" fill="none" stroke="url(#primaryGlow)" stroke-width="10" transform="rotate(-30)"/>
    <ellipse rx="150" ry="62" fill="none" stroke="url(#primaryGlow)" stroke-width="10" transform="rotate(90)"/>
    
    <!-- Kinetic Electron Dots -->
    <circle cx="150" cy="0" r="10" fill="#06b6d4" transform="rotate(30)"/>
    <circle cx="-150" cy="0" r="10" fill="#a855f7" transform="rotate(-30)"/>
    <circle cx="0" cy="62" r="10" fill="#6366f1" transform="rotate(90)"/>
  </g>
</svg>
